[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diagrams-so"
version = "1.4.0"
description = "Python SDK for the Diagrams.so public API — generate, edit, and manage cloud architecture diagrams with AI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RedHold / Diagrams.so" }]
keywords = ["diagram", "architecture", "aws", "azure", "gcp", "drawio", "ai"]
dependencies = []  # stdlib-only; uses `requests` if present, else urllib

[project.scripts]
# Same command name the MCP package installs, deliberately: whichever ecosystem
# you are in, `diagrams-so login` connects the machine and writes the one shared
# credential file.
diagrams-so = "diagrams_so.cli:main"

[project.urls]
Homepage = "https://diagrams.so"
Documentation = "https://diagrams.so/developers"
Repository = "https://github.com/RedHold/diagrams-sdk"
Issues = "https://github.com/RedHold/diagrams-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["diagrams_so*"]

[tool.setuptools.package-data]
diagrams_so = ["py.typed"]
